<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-labelledby="footTitle footDesc">
  <title id="footTitle">Footer strip</title>
  <desc id="footDesc">github.com/Babitdor | ML, GenAI, agentic AI | Erlangen, Germany</desc>
  <defs>
    <pattern id="fticks" width="12" height="5" patternUnits="userSpaceOnUse">
      <path d="M0.5 0V5" stroke="#1C2220" stroke-width="1"/>
    </pattern>
    <pattern id="fticksMajor" width="48" height="9" patternUnits="userSpaceOnUse">
      <path d="M0.5 0V9" stroke="#2C3A33" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .tk { letter-spacing: 2.4px; }
      @media (prefers-reduced-motion: no-preference) {
        .pulse { animation: pulse 4.5s ease-in-out infinite; }
      }
      @keyframes pulse { 0%, 100% { opacity: 0.75; } 50% { opacity: 0.3; } }
    </style>
  </defs>

  <rect width="1200" height="84" fill="#0A0C0B"/>
  <rect x="0.5" y="0.5" width="1199" height="83" fill="none" stroke="#232A27"/>
  <rect x="0" y="0" width="2" height="84" fill="#FFB454" opacity="0.75"/>
  <rect class="pulse" x="1197" y="0" width="3" height="84" fill="#FFB454"/>

  <text x="32" y="38" class="tk" font-size="11" fill="#7A847D">GITHUB.COM/BABITDOR</text>
  <text x="600" y="38" font-size="11" fill="#FFB454" text-anchor="middle" letter-spacing="3.2">ML · GENAI · AGENTIC AI</text>
  <text x="1168" y="38" class="tk" font-size="11" fill="#7A847D" text-anchor="end">ERLANGEN, GERMANY</text>

  <rect x="0" y="79" width="1200" height="5" fill="url(#fticks)"/>
  <rect x="0" y="75" width="1200" height="9" fill="url(#fticksMajor)"/>
</svg>
