<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Babitdor Kayang Khonglah</title>
  <desc id="heroDesc">Terminal-styled banner. Babitdor Kayang Khonglah, AI engineer based in Erlangen, Germany. Focus: agent harnesses and LLM fine-tuning. Three SysML v2 models published on Ollama.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C100E"/>
      <stop offset="0.5" stop-color="#080A09"/>
      <stop offset="1" stop-color="#0E1210"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.08" cy="-0.1" r="0.9">
      <stop offset="0" stop-color="#FFB454" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#FFB454" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#FFB454" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridfade" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="scangrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB454" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#FFB454" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#FFB454" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFB454" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 0H24M0 0V24" fill="none" stroke="#1C2220" stroke-width="1"/>
    </pattern>
    <pattern id="tickMinor" width="12" height="5" patternUnits="userSpaceOnUse">
      <path d="M0.5 0V5" stroke="#1C2220" stroke-width="1"/>
    </pattern>
    <pattern id="tickMajor" width="48" height="9" patternUnits="userSpaceOnUse">
      <path d="M0.5 0V9" stroke="#2C3A33" stroke-width="1"/>
    </pattern>
    <mask id="gridmask">
      <rect x="0" y="0" width="1200" height="340" fill="url(#gridfade)"/>
    </mask>
    <mask id="typemask">
      <rect class="wipe" x="44" y="250" width="668" height="30" fill="#FFFFFF"/>
    </mask>
    <filter id="phosphor" x="-20%" y="-140%" width="140%" height="380%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .tk { letter-spacing: 2.2px; }
      .wipe { transform-box: fill-box; transform-origin: left center; }
      @media (prefers-reduced-motion: no-preference) {
        .wipe { animation: wipe 2.2s steps(48, end) 0.6s both; }
        .caret { animation: caret 1.1s steps(1, end) 2.9s infinite both; }
        .scan { animation: scan 8s linear 1.5s infinite; }
        .r1 { animation: rise 0.75s cubic-bezier(0.2, 0.75, 0.2, 1) 0.1s both; }
        .r2 { animation: rise 0.75s cubic-bezier(0.2, 0.75, 0.2, 1) 0.25s both; }
        .r3 { animation: rise 0.75s cubic-bezier(0.2, 0.75, 0.2, 1) 0.4s both; }
        .r4 { animation: rise 0.75s cubic-bezier(0.2, 0.75, 0.2, 1) 0.55s both; }
        .r5 { animation: rise 0.75s cubic-bezier(0.2, 0.75, 0.2, 1) 0.7s both; }
        .r6 { animation: rise 0.75s cubic-bezier(0.2, 0.75, 0.2, 1) 0.85s both; }
      }
      @keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes scan { 0% { transform: translateY(44px); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateY(300px); opacity: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#bloom)"/>
  <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="url(#scangrad)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" fill="none" stroke="#232A27"/>
  <path d="M0 16V0h16M1184 0h16v16M1200 324v16h-16M16 340H0v-16" fill="none" stroke="#FFB454" stroke-opacity="0.4" stroke-width="2"/>

  <g class="r1">
    <rect x="48" y="19" width="6" height="6" fill="#FFB454"/>
    <text x="64" y="28" class="tk" font-size="12" fill="#828C85">~/profiles/babitdor</text>
    <text x="1152" y="28" class="tk" font-size="11" fill="#5C6660" text-anchor="end">AI · ML · AGENT SYSTEMS</text>
  </g>
  <path d="M0 44H1200" stroke="#1E2422"/>

  <g class="r2">
    <text x="48" y="112" class="tk" font-size="13" fill="#FFB454" filter="url(#phosphor)">&gt; whoami --verbose</text>
  </g>

  <g class="r3">
    <text x="48" y="174" font-size="54" font-weight="700" fill="#EEF1EA" letter-spacing="1">BABITDOR</text>
    <text x="48" y="230" font-size="54" font-weight="700" fill="none" stroke="#59645D" stroke-width="1.1" letter-spacing="1">KAYANG KHONGLAH</text>
  </g>

  <g class="r4">
    <g mask="url(#typemask)">
      <text x="48" y="272" font-size="16" fill="#FFB454" textLength="182" lengthAdjust="spacing" filter="url(#phosphor)">babitdor@erlangen:~$</text>
      <text x="246" y="272" font-size="16" fill="#C8D0C7" textLength="404" lengthAdjust="spacing">building agent harnesses · LLM fine-tuning</text>
      <rect class="caret" x="656" y="257" width="9" height="17" fill="#FFB454"/>
    </g>
  </g>

  <g class="r5">
    <rect x="712" y="76" width="440" height="188" fill="#0D100E"/>
    <rect x="712" y="76" width="440" height="188" fill="none" stroke="#232A27"/>
    <rect x="712" y="76" width="2" height="188" fill="#FFB454"/>

    <text x="740" y="106" class="tk" font-size="10.5" fill="#6B756E">ROLE</text>
    <text x="740" y="130" font-size="15" fill="#E8ECE5">AI engineer · agent systems</text>
    <path d="M740 143H1124" stroke="#191F1D"/>

    <text x="740" y="168" class="tk" font-size="10.5" fill="#6B756E">BASED IN</text>
    <text x="740" y="192" font-size="15" fill="#E8ECE5">Erlangen, Germany</text>
    <path d="M740 205H1124" stroke="#191F1D"/>

    <text x="740" y="230" class="tk" font-size="10.5" fill="#6B756E">PUBLISHED</text>
    <text x="740" y="254" font-size="15" fill="#E8ECE5">3 SysML v2 models on Ollama</text>
  </g>

  <g class="r6">
    <text x="48" y="330" class="tk" font-size="11" fill="#6B756E">GITHUB.COM/BABITDOR</text>
    <text x="1152" y="330" class="tk" font-size="11" fill="#6B756E" text-anchor="end">BABITDORKHONGLAH.NETLIFY.APP</text>
  </g>

  <path d="M0 304H1200" stroke="#1E2422"/>
  <rect x="0" y="304" width="1200" height="5" fill="url(#tickMinor)"/>
  <rect x="0" y="304" width="1200" height="9" fill="url(#tickMajor)"/>
</svg>
